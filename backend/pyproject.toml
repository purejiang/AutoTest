[project]
name = "autotest-backend"
version = "0.1.1"
description = "Android automated testing tool - backend (adb/uiautomator2/scrcpy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<3.0",
    "pydantic>=2.9,<3.0",
    "uiautomator2>=3.7.1,<4.0",
    "adbutils>=2.12.0,<3.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
network = ["mitmproxy>=12.3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
